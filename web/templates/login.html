<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        darkbg: '#0a0d14',
                        darkcard: '#111726',
                        darkborder: '#1f293d',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0a0d14;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Ambient background gradients -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 shadow-lg shadow-indigo-500/30 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Gravity<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">DNS</span></h1>
            <p class="text-slate-400 text-sm mt-1">High-Performance SmartDNS & SNI Proxy Platform</p>
        </div>

        <!-- Card Container -->
        <div class="bg-darkcard/90 backdrop-blur-xl border border-darkborder rounded-2xl p-8 glow-effect shadow-2xl">
            <div id="card-header">
                <h2 id="card-title" class="text-xl font-bold text-white mb-2">Control Plane Access</h2>
                <p id="card-desc" class="text-slate-400 text-sm mb-6">Enter your administrator credentials to sign in.</p>
            </div>

            <div id="error-alert" class="hidden mb-5 p-3.5 rounded-xl bg-red-950/50 border border-red-800/60 text-red-300 text-sm flex items-center gap-2.5">
                <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="error-message">Invalid credentials</span>
            </div>

            <!-- Standard Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" required autofocus placeholder="admin"
                            class="w-full pl-10 pr-4 py-3 bg-darkbg/80 border border-darkborder rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required placeholder="••••••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-darkbg/80 border border-darkborder rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <!-- Initial Setup Confirm Password Field (hidden by default) -->
                <div id="confirm-password-container" class="hidden">
                    <label for="confirm-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                        </div>
                        <input type="password" id="confirm-password" placeholder="••••••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-darkbg/80 border border-darkborder rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center gap-2">
                    <span id="btn-text">Authenticate Session</span>
                    <svg id="btn-spinner" class="hidden animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 text-center text-xs text-slate-500">
            <p>Domain: <span class="code-font text-slate-400">{{.Domain}}</span></p>
            <p class="mt-1">Secured with TLS 1.3 &bull; Sliding-Window Device Limiting</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-alert');
        const alertMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        let isSetupMode = {{if .IsNewSetup}}true{{else}}false{{end}};

        async function checkSetup() {
            try {
                const res = await fetch('/api/setup/status');
                if (res.ok) {
                    const data = await res.json();
                    if (!data.configured) {
                        enableSetupMode();
                    }
                }
            } catch (e) {}
        }

        function enableSetupMode() {
            isSetupMode = true;
            document.getElementById('card-title').textContent = 'Initial Setup: Create Admin Account';
            document.getElementById('card-desc').textContent = 'Configure the master administrator credentials for GravityDNS.';
            document.getElementById('confirm-password-container').classList.remove('hidden');
            document.getElementById('confirm-password').required = true;
            btnText.textContent = 'Initialize & Launch Platform';
        }

        if (isSetupMode) {
            enableSetupMode();
        } else {
            checkSetup();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            btnText.textContent = isSetupMode ? 'Initializing...' : 'Authenticating...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (isSetupMode) {
                const confirmPassword = document.getElementById('confirm-password').value;
                if (password !== confirmPassword) {
                    alertMsg.textContent = 'Passwords do not match.';
                    alertBox.classList.remove('hidden');
                    btnText.textContent = 'Initialize & Launch Platform';
                    btnSpinner.classList.add('hidden');
                    submitBtn.disabled = false;
                    return;
                }
                if (password.length < 8) {
                    alertMsg.textContent = 'Password must be at least 8 characters long.';
                    alertBox.classList.remove('hidden');
                    btnText.textContent = 'Initialize & Launch Platform';
                    btnSpinner.classList.add('hidden');
                    submitBtn.disabled = false;
                    return;
                }

                try {
                    const res = await fetch('/api/setup/initialize', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Setup failed');

                    btnText.textContent = 'Launching Platform...';
                    window.location.href = '/';
                } catch (err) {
                    alertMsg.textContent = err.message;
                    alertBox.classList.remove('hidden');
                    btnText.textContent = 'Initialize & Launch Platform';
                    btnSpinner.classList.add('hidden');
                    submitBtn.disabled = false;
                }
                return;
            }

            // Normal login
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Authentication failed');
                }

                btnText.textContent = 'Redirecting...';
                window.location.href = '/';
            } catch (err) {
                alertMsg.textContent = err.message;
                alertBox.classList.remove('hidden');
                btnText.textContent = 'Authenticate Session';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

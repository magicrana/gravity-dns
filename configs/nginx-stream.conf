# ==============================================================================
# GravityDNS - Optional Nginx Stream SNI Proxy Configuration
# Alternative to pure Go SNI proxy for administrators preferring Nginx stream
# Place in: /etc/nginx/modules-enabled/50-gravity-stream.conf or include in /etc/nginx/nginx.conf
# ==============================================================================

stream {
    # Independent Upstream DNS Resolvers (Cloudflare & Google)
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 3s;

    # Dynamic upstream map based on extracted SNI hostname
    map $ssl_preread_server_name $upstream_backend {
        # Optional whitelist / blacklist mappings
        ""              127.0.0.1:8080;  # fallback to panel or block
        default         $ssl_preread_server_name:443;
    }

    server {
        listen 443;
        listen [::]:443;

        # Peek TLS ClientHello without decrypting / terminating TLS
        ssl_preread on;

        # Transparent stream forwarding
        proxy_pass $upstream_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;

        # Socket buffer tuning for 4K streaming
        proxy_buffer_size 32k;
        tcp_nodelay on;
    }
}

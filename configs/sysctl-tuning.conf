# ==============================================================================
# GravityDNS - Linux Kernel Network & High-Concurrency Sysctl Tuning
# Target: Ubuntu 22.04 / 24.04 LTS (Optimized for TCP 443 SNI Streaming & DNS)
# Deploy: sudo cp sysctl-tuning.conf /etc/sysctl.d/99-gravitydns.conf && sudo sysctl -p /etc/sysctl.d/99-gravitydns.conf
# ==============================================================================

# Enable TCP BBR Congestion Control for maximum video streaming throughput
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase maximum file descriptors and socket backlog
fs.file-max = 2097152
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Increase socket read/write memory buffers (up to 16MB for 4K video streams)
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# TCP connection reuse and timeout optimizations
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Ephemeral port range expansion
net.ipv4.ip_local_port_range = 1024 65535

# Increase Netfilter connection tracking table limits
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
